<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Table Example1</title>
</head>
<body>
    <header>
        <h1>
            <center>
                <font color="red">360</font>
                <font color="green"> Digrii</font>
            </center>
        </h1>
    </header>
    <hr>
    <table border="3px" bgcolor="silver" align="center" cellpadding="5px" cellspacing="5px">
        <caption>Employee Data</caption>
        <thead>
            <tr>
                <th>Cricketer-Data</th>
                <th>Age</th>
                <th>Salary</th>
                <th>Photo</th>
                <th>Info</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Rayna Vero</td>
                <td>22</td>
                <td>20000</td>
                <td>
                    <img src="images/emp1.webp" height="50px" width="50px">
                </td>
                <td>
                    <a href="https://en.wikipedia.org/wiki/Mithali_Raj"target="_blank">Clickhere</a>
                </td>
            </tr>
            <tr>
                 <td>Ramya</td>
                <td>32</td>
                <td>200000</td>
                <td>
                    <img src="images/emp2.webp" height="50px" width="50px">
                </td>
                   <td>
                    <a href="https://en.wikipedia.org/wiki/Smriti_Mandhana">Clickhere</a>
                </td>
            </tr>
            <tr>
                 <td>Poojitha</td>
                <td>28</td>
                <td>15000</td>
            </tr>

        </tbody>
    </table>
</body>
</html>
