<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport Application</title>
</head>
<body>
    <header>
        <center>
            <h1>Passport Applicatiion form</h1>
        </center>
    </header>
    <hr>
    <main>
        <h2><center>Application details</center></h2>
        <form>
            <table border="3px" align="center">
                <tr>
                    <td><label>Full Name</label></td>
                    <td><input type="text"></td>
                </tr>
                 <tr>
                    <td><label>Create Password</label>/td>
                    <td><input type="password"></td>
                </tr>
                 <tr>
                    <td><label>Email Address</label></td>
                    <td><input type="email"></td>
                </tr>
                 <tr>
                    <td><label>Mobie Number</label></td>
                    <td><input type="tel"></td>
                </tr>
                 <tr>
                    <td><label>Date of Birth</label></td>
                    <td><input type="date"></td>
                </tr>
                 <tr>
                    <td><label>Age</label></td>
                    <td><input type="number"></td>
                </tr>
                 <tr>
                    <td><label>Gender</label></td>
                    <td><input type="radio" value="Male">Male
                        <input type="radio" value="FeMale">FeMale
                    <input type="radio" value="Others">Others</td>
                </tr>
                 <tr>
                    <td><label>Martial Status</label></td>
                    <td><select>
                <option value="Selected Status">Select Status</option>
                <option value="MARRIED">Married</option>
                <option value="UNMARRIED">Unmarried</option>
            </select></td>
                </tr>
                 <tr>
                    <td><label>Nationality</label></td>
                    <td><select>
                <option value="Seclect Country">Select Country</option>
                <option value="INDIA">India</option>
                <option value="USA">Usa</option>
                <option value="UK">Uk</option>
                <option value="ENGLAND">England</option>
            </select></td>
                </tr>
                 <tr>
                    <td><label>Passport type</label></td>
                    <td> <input type="checkbox" value="Normal">normal
            <input type="checkbox" value="Tatkal">tatkal
            <input type="checkbox" value="Diplommatic">diplomatioc</td>
                </tr>
                 <tr>
                    <td><label>Occupation</label></td>
                    <td><input type="text"></td>
                </tr>
                 <tr>
                    <td><label>Personal Website</label></td>
                    <td><textarea rows="5" cols="10"></textarea></td>
                </tr>
                 <tr>
                    <td><label>Uppload Passport Photo</label></td>
                    <td> <input type="file"></td>
                </tr>
                 <tr>
                    <td><label>Uppload Aadhar Photo</label></td>
                    <td><input type="file"></td>
                </tr>
                 <tr>
                    <td> <label>Uppload Signature</label></td>
                    <td> <input type="file"></td>
                </tr>
                 <tr>
                    <td><label>Declaration</label></td>
                    <td><input type="checkbox" value="Acceptance..">I here by declare all the information provided is true.</td>
                </tr>
                 <tr>
                    <td></td>
                    <td><input type="submit" value="Apply passport">
            <input type="reset" value="clear">
            <input type="button" value="preview"></td>
                </tr>
            </table>
        </form>
    </main>
    <hr>
    <footer>
        <center>
            <h3>
                copyright@vamsi
            </h3>
        </center>
    </footer>

</body>
</html>
